<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LIM: Il Pollaio</title>
    <meta name="theme-color" content="#fff8ec" />
    <meta name="robots" content="noindex" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%94%3C/text%3E%3C/svg%3E"
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/lim.css" />
    <script type="module" src="js/lim.js"></script>
  </head>
  <body class="lim">
    <header class="lim-testa">
      <a class="lim-logo" href="./" aria-label="Torna alle classi">🐔 Il Pollaio</a>
      <h1 id="nome-classe" class="lim-classe">...</h1>
      <span class="spazio"></span>
      <label class="sr-only" for="sel-stagione">Stagione</label>
      <select id="sel-stagione" class="lim-select"></select>
      <button id="btn-albo" class="btn piccolo" type="button">🏆 Albo d'oro</button>
      <button id="btn-audio" class="btn piccolo" type="button" aria-pressed="true">🔊</button>
      <button id="btn-schermo" class="btn piccolo" type="button" aria-label="Schermo intero">
        ⛶
      </button>
    </header>

    <p id="banner-storico" class="lim-banner nascosto" role="status"></p>
    <p id="messaggio" class="lim-messaggio" role="status">Carico il pollaio...</p>

    <main class="lim-griglia">
      <section class="pannello p-tacchini" aria-labelledby="t-tacchini">
        <h2 id="t-tacchini">🦃 Classifica tacchini</h2>
        <ol id="tacchini" class="classifica"></ol>
      </section>

      <section class="pannello p-patatini" aria-labelledby="t-patatini">
        <h2 id="t-patatini">🥔 Patatini</h2>
        <ol id="patatini" class="classifica"></ol>
      </section>

      <section class="pannello p-naso" aria-labelledby="t-naso">
        <h2 id="t-naso">🤡 Naso rosso</h2>
        <div id="naso" class="naso"></div>
      </section>

      <section class="pannello p-perle" aria-labelledby="t-perle">
        <h2 id="t-perle">✨ Ultime perle</h2>
        <div id="totali" class="totali"></div>
        <ol id="perle" class="perle"></ol>
      </section>
    </main>

    <dialog id="albo" class="albo" aria-labelledby="t-albo">
      <form method="dialog">
        <div class="albo-testa">
          <h2 id="t-albo">🏆 Albo d'oro</h2>
          <button class="btn piccolo" type="submit" value="chiudi" aria-label="Chiudi">✕</button>
        </div>
        <ol id="albo-lista" class="albo-lista"></ol>
      </form>
    </dialog>
  </body>
</html>
